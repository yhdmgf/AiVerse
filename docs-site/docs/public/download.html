<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载 AiVerse</title>
<style>
/* =====================================================================
   设计基调：静谧编辑风 —— 暖纸色中性底、墨色主操作、衬线版本号做视觉锚点，
   阴影克制、圆角偏小，状态靠明度/描边/细小图形区分，而非高饱和色。
   ===================================================================== */

/* ---------- 设计令牌 ---------- */
:root{
  /* spacing scale */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;

  /* neutral roles（亮色） */
  --bg:#efede7;            /* 页面背景 */
  --surface:#fbfaf7;       /* 主表面 */
  --surface-2:#f2efe8;     /* 次表面（左栏 / 分段控件底） */
  --surface-3:#e9e5db;     /* 按下态表面 */
  --border:#e2ded4;        /* 常规边框 */
  --border-strong:#cdc8ba; /* 强边框（控件） */
  --text:#1c1b19;          /* 主要文字 */
  --text-2:#5b5850;        /* 次要文字 */
  --text-disabled:#aaa598; /* 禁用文字 */
  --ink:#1c1b19;           /* 主按钮底 / 聚焦环 */
  --ink-hover:#38362f;
  --ink-active:#0e0d0c;
  --on-ink:#fbfaf7;
  --accent:#3451b2;        /* 仅用于文字链接，不做光环/渐变 */

  /* 语义色 */
  --ok:#2c6a4d;   --ok-bg:#e3eee7;
  --err:#a23b2e;  --err-bg:#f6e6e1;  --err-border:#dfb4aa;
  --beta:#86571d; --beta-bg:#f2e7d3;
  --test:#9b2955; --test-bg:#f7e4ec;

  --focus:var(--ink);
  --scrim:rgba(28,27,25,.46);
  --shadow-panel:0 1px 0 rgba(255,255,255,.6) inset,0 24px 48px -16px rgba(28,27,25,.28),0 2px 6px rgba(28,27,25,.08);
  --shadow-sm:0 1px 2px rgba(28,27,25,.08);

  /* 圆角 / 字号 / 字体 */
  --r-1:6px; --r-2:8px; --r-3:12px;
  --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:40px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-serif:"Iowan Old Style","Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ctl-h:40px; --ctl-h-sm:32px;

  /* 动效：状态 120–200ms */
  --t-fast:120ms; --t:160ms; --t-slow:200ms;
  --ease:cubic-bezier(.2,.7,.2,1);
  --spring:cubic-bezier(.3,1.3,.5,1);
}
html.dark{
  --bg:#0f0f0e; --surface:#1d1c1a; --surface-2:#171614; --surface-3:#262521;
  --border:#33312c; --border-strong:#4a4740;
  --text:#ebe8e0; --text-2:#a9a498; --text-disabled:#6a665d;
  --ink:#ebe8e0; --ink-hover:#fff; --ink-active:#cfcabd; --on-ink:#1d1c1a;
  --accent:#8ea3ec;
  --ok:#6fcf9f; --ok-bg:rgba(111,207,159,.13);
  --err:#ef8f80; --err-bg:rgba(239,143,128,.12); --err-border:rgba(239,143,128,.38);
  --beta:#e2a763; --beta-bg:rgba(226,167,99,.13);
  --test:#e076a3; --test-bg:rgba(224,118,163,.13);
  --scrim:rgba(0,0,0,.6);
  --shadow-panel:0 1px 0 rgba(255,255,255,.05) inset,0 24px 56px -12px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html.is-locked{overflow:hidden;padding-right:var(--sbw,0px)}
body{
  font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.65;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;
}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:14px;height:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- 宿主页（模态关闭后可见） ---------- */
.host{max-width:720px;padding:var(--s-6) var(--s-5)}
.host-brand{display:inline-flex;align-items:center;gap:var(--s-2);font-weight:600;margin-bottom:var(--s-6)}
.host h1{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-lg);letter-spacing:-.01em;margin-bottom:var(--s-2)}
.host p{color:var(--text-2);max-width:46ch;margin-bottom:var(--s-5)}

/* =====================================================================
   按钮 .btn
   default      .btn-primary / .btn-secondary
   hover        .btn:hover
   focus-visible.btn:focus-visible
   active       .btn:active
   disabled     .btn[aria-disabled="true"], .btn:disabled
   loading      .btn.is-loading
   success      .btn.is-success
   error        .btn.is-error
   ===================================================================== */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  height:var(--ctl-h);padding:0 var(--s-4);border-radius:var(--r-2);border:1px solid transparent;
  font:inherit;font-size:var(--fs-base);font-weight:550;line-height:1;text-decoration:none;white-space:nowrap;cursor:pointer;
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),
             transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-primary:hover{background:var(--ink-hover)}
.btn-primary:active{background:var(--ink-active);transform:scale(.98)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-2);border-color:var(--text-2)}
.btn-secondary:active{background:var(--surface-3);transform:scale(.98)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--focus)}
.btn[aria-disabled="true"],.btn:disabled{
  background:var(--surface-2);color:var(--text-disabled);border-color:var(--border);
  cursor:not-allowed;pointer-events:none;transform:none;
}
.btn .btn-ic{position:relative;display:inline-grid;place-items:center;width:18px;height:18px}
.btn .btn-ic>*{grid-area:1/1;transition:opacity var(--t-fast) var(--ease),transform var(--t) var(--ease)}
.btn .i-check,.btn .spin{opacity:0;transform:scale(.6)}
/* loading */
.btn.is-loading{pointer-events:none;cursor:progress}
.btn.is-loading .i-dl{opacity:0;transform:scale(.6)}
.btn.is-loading .spin{opacity:1;transform:none}
/* success */
.btn.is-success{background:var(--ok-bg);color:var(--ok);border-color:transparent;pointer-events:none}
.btn.is-success .i-dl,.btn.is-success .spin{opacity:0}
.btn.is-success .i-check{opacity:1;transform:none}
/* error（重试失败时短暂提示） */
.btn.is-error{background:var(--err-bg);color:var(--err);border-color:var(--err-border)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* =====================================================================
   图标按钮 .icon-btn（关闭 / 主题）
   default / hover / focus-visible / active 如下
   ===================================================================== */
.icon-btn{
  display:inline-grid;place-items:center;width:var(--ctl-h-sm);height:var(--ctl-h-sm);border-radius:var(--r-2);
  border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;
  transition:background-color var(--t) var(--ease),color var(--t) var(--ease),border-color var(--t) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.icon-btn:active{background:var(--surface-3);transform:scale(.94)}
.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--focus)}
.icon-btn:disabled{color:var(--text-disabled);cursor:not-allowed;background:transparent;border-color:transparent}
.icon-btn .i-sun{display:none}
html.dark .icon-btn .i-sun{display:block}
html.dark .icon-btn .i-moon{display:none}

/* =====================================================================
   模态骨架 + 遮罩
   进入：scrim 透明度 200ms；panel 轻微 scale + translateY + 透明度（spring）
   退出：更快（160ms）ease-out。仅使用 transform/opacity，布局不跳动。
   ===================================================================== */
.dl{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:var(--s-5);visibility:hidden;transition:visibility 0s linear 160ms}
.dl[data-open="true"]{visibility:visible;transition-delay:0s}
.dl-scrim{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity 160ms var(--ease)}
.dl[data-open="true"] .dl-scrim{opacity:1;transition-duration:var(--t-slow)}
.dl-panel{
  position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);
  width:min(900px,100%);height:min(640px,calc(100dvh - var(--s-6)*2));
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);box-shadow:var(--shadow-panel);overflow:hidden;
  opacity:0;transform:translateY(var(--s-2)) scale(.97);transform-origin:50% 60%;
  transition:opacity 160ms var(--ease),transform 160ms var(--ease);
}
.dl[data-open="true"] .dl-panel{opacity:1;transform:none;transition:opacity var(--t-slow) var(--ease),transform 240ms var(--spring)}
.dl-panel:focus{outline:none}

/* ---------- 左栏：上下文层（版本 / 更新日志） ---------- */
.rail{display:flex;flex-direction:column;min-height:0;padding:var(--s-6) var(--s-5) var(--s-5) var(--s-6);background:var(--surface-2);border-right:1px solid var(--border)}
.rail-brand{display:flex;align-items:center;gap:var(--s-2);font-weight:600;font-size:var(--fs-sm);color:var(--text-2);margin-bottom:var(--s-6)}
.rail h2{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-lg);letter-spacing:-.01em;margin-bottom:var(--s-2)}
.rail .sub{font-size:var(--fs-sm);color:var(--text-2);margin-bottom:var(--s-5);max-width:34ch}
.eyebrow{display:flex;align-items:center;gap:var(--s-2);font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin-bottom:var(--s-2)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 var(--s-2);border-radius:var(--r-1);font-size:var(--fs-xs);font-weight:600;letter-spacing:0;text-transform:none}
.badge.stable{background:var(--ok-bg);color:var(--ok)}
.badge.beta{background:var(--beta-bg);color:var(--beta)}
.badge.test{background:var(--test-bg);color:var(--test)}
.ver-big{font-family:var(--font-serif);font-size:var(--fs-xl);line-height:1.1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-height:44px;word-break:break-all}
.ver-meta{font-size:var(--fs-sm);color:var(--text-2);margin-top:var(--s-2);min-height:21px}
.ver-sync{margin-top:var(--s-3);font-size:var(--fs-sm);padding:var(--s-3) var(--s-3);border-radius:var(--r-sm,10px);border:1px solid var(--border);background:var(--surface-2,transparent);line-height:1.5}
.ver-sync .vs-row{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.ver-sync .vs-dot{width:8px;height:8px;border-radius:50%;flex:none}
.ver-sync.ok{border-color:rgba(46,125,91,.45);background:var(--green-soft,#DFF0E6)}
.ver-sync.ok .vs-dot{background:var(--green,#2E7D5B)}
.ver-sync.ok .vs-title{color:var(--green,#2E7D5B);font-weight:600}
.ver-sync.behind{border-color:rgba(181,131,46,.5);background:var(--amber-soft,#F6ECD8)}
.ver-sync.behind .vs-dot{background:var(--amber,#B5832E)}
.ver-sync.behind .vs-title{color:var(--amber,#B5832E);font-weight:600}
.ver-sync .vs-sub{color:var(--text-2);margin-top:var(--s-1);font-size:var(--fs-xs)}
.ver-sync .vs-sub a{color:var(--green,#2E7D5B);font-weight:600;text-decoration:underline}
.ver-sync .vs-hash{font-family:var(--font-mono,monospace);font-size:var(--fs-xs);color:var(--text-2)}
.ver-test-badge{display:inline-block;vertical-align:middle;margin-left:var(--s-2);padding:2px 10px;border-radius:999px;background:var(--beta-bg,#F2E7D3);color:var(--beta,#86571D);font-family:var(--font-sans,sans-serif);font-size:var(--fs-xs);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.notes-label{margin-top:var(--s-5);padding-top:var(--s-4);border-top:1px solid var(--border);margin-bottom:var(--s-3)}
.release-note{flex:1;min-height:0;overflow:auto;font-size:var(--fs-sm);color:var(--text-2);padding-right:var(--s-2);scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.release-note h2,.release-note h3,.release-note h4,.release-note h5,.release-note h6{font-size:var(--fs-sm);color:var(--text);font-weight:600;margin:var(--s-4) 0 var(--s-1)}
.release-note h2:first-child,.release-note h3:first-child{margin-top:0}
.release-note p{margin-bottom:var(--s-2)}
.release-note ul,.release-note ol{padding-left:var(--s-5);margin-bottom:var(--s-3)}
.release-note li{margin-bottom:var(--s-1)}
.release-note code{font-family:var(--font-mono);font-size:var(--fs-xs);background:var(--surface-3);padding:0 var(--s-1);border-radius:4px}
.release-note a{color:var(--accent);text-underline-offset:2px}
.release-note table{border-collapse:collapse;width:100%;margin-bottom:var(--s-3)}
.release-note th,.release-note td{border-bottom:1px solid var(--border);text-align:left;padding:var(--s-1) var(--s-2)}
.release-note hr{border:0;border-top:1px solid var(--border);margin:var(--s-3) 0}
/* GitHub 风格告警卡片（> [!NOTE] / [!TIP] / [!IMPORTANT] / [!WARNING] / [!CAUTION]） */
.release-note .md-alert{--ac:var(--text-2);--ac-bg:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--ac);background:var(--ac-bg);border-radius:var(--r-1);padding:var(--s-2) var(--s-3);margin-bottom:var(--s-3)}
.release-note .md-alert-title{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;color:var(--ac);margin-bottom:2px}
.release-note .md-alert-body{font-size:var(--fs-xs);color:var(--text-2);line-height:1.6}
.release-note .md-alert--note{--ac:var(--accent);--ac-bg:rgba(52,81,178,.07)}
.release-note .md-alert--tip{--ac:#2c6a4d;--ac-bg:#e3eee7}
.release-note .md-alert--important{--ac:#6a3fa0;--ac-bg:#ece4f6}
.release-note .md-alert--warning{--ac:#86571d;--ac-bg:#f2e7d3}
.release-note .md-alert--caution{--ac:#a23b2e;--ac-bg:#f6e6e1}
html.dark .release-note .md-alert{border-color:var(--border)}
html.dark .release-note .md-alert--note{--ac:#8ea3ec;--ac-bg:rgba(142,163,236,.12)}
html.dark .release-note .md-alert--tip{--ac:#6fcf9f;--ac-bg:rgba(111,207,159,.13)}
html.dark .release-note .md-alert--important{--ac:#b79ae8;--ac-bg:rgba(183,154,232,.13)}
html.dark .release-note .md-alert--warning{--ac:#e2a763;--ac-bg:rgba(226,167,99,.13)}
html.dark .release-note .md-alert--caution{--ac:#ef8f80;--ac-bg:rgba(239,143,128,.12)}
.release-note blockquote{margin:0 0 var(--s-3);padding:var(--s-1) var(--s-3);border-left:3px solid var(--border-strong);color:var(--text-2);font-size:var(--fs-xs)}

/* ---------- 右栏：操作层 ---------- */
.ops{display:flex;flex-direction:column;min-height:0;min-width:0}
.ops-bar{display:flex;justify-content:flex-end;gap:var(--s-1);padding:var(--s-3) var(--s-3) 0}
.ops-body{flex:1;min-height:0;overflow:auto;padding:var(--s-2) var(--s-6) var(--s-5);scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.group{margin-bottom:var(--s-5)}
.group-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin-bottom:var(--s-2)}

/* =====================================================================
   分段控件 .switch / .switch-btn
   default      .switch-btn
   selected     .switch-btn.active（thumb 滑块跟随）
   hover        .switch-btn:hover
   focus-visible.switch-btn:focus-visible
   active       .switch-btn:active
   disabled     .switch-btn:disabled（数据加载中 / 失败时）
   ===================================================================== */
.switch{position:relative;display:flex;padding:var(--s-1);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-2)}
.switch .thumb{position:absolute;top:var(--s-1);bottom:var(--s-1);left:0;width:0;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-1);box-shadow:var(--shadow-sm);opacity:0;transition:transform var(--t-slow) var(--ease),width var(--t-slow) var(--ease),opacity var(--t-fast) var(--ease)}
.switch .thumb.ready{opacity:1}
.switch.no-anim .thumb{transition:none}
.switch-btn{
  position:relative;z-index:1;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  height:var(--ctl-h-sm);border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);
  font:inherit;font-size:var(--fs-sm);font-weight:550;cursor:pointer;
  transition:color var(--t) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);
}
.switch-btn:hover{color:var(--text)}
.switch-btn:active{transform:scale(.97)}
.switch-btn.active{color:var(--text)}
.switch-btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--focus)}
.switch-btn:disabled{color:var(--text-disabled);cursor:not-allowed;transform:none}
.switch-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--text-disabled);transition:background-color var(--t) var(--ease)}
.switch-btn[data-channel="stable"].active .dot{background:var(--ok)}
.switch-btn[data-channel="beta"].active .dot{background:var(--beta)}
.switch-btn[data-channel="test"].active .dot{background:var(--test)}
.switch-btn[data-source].active .dot{background:var(--text)}

/* 提示条 */
.source-note{display:flex;gap:var(--s-2);align-items:flex-start;margin-top:var(--s-3);padding:var(--s-2) var(--s-3);border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--border);font-size:var(--fs-xs);color:var(--text-2);line-height:1.6}
.source-note[hidden]{display:none}
.source-note .ic{margin-top:2px}
.source-note b{color:var(--text)}

/* =====================================================================
   安装包行 .pkg —— 推荐项（.is-rec）视觉权重最高，其余降级
   default / hover(.pkg:hover) / 内部按钮见 .btn
   ===================================================================== */
.pkgs{display:flex;flex-direction:column;gap:var(--s-3)}
.pkg{padding:var(--s-4);border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);transition:border-color var(--t) var(--ease),background-color var(--t) var(--ease)}
.pkg:hover{border-color:var(--border-strong)}
.pkg.is-rec{border-color:var(--border-strong);background:var(--surface);box-shadow:var(--shadow-sm)}
.pkg-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-3)}
.pkg-id{display:flex;align-items:center;gap:var(--s-2)}
.pkg-name{font-weight:650;font-size:var(--fs-md)}
.tag{font-size:var(--fs-xs);font-weight:600;color:var(--on-ink);background:var(--ink);border-radius:var(--r-1);padding:0 var(--s-2);line-height:20px}
.pkg-size{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-2);font-variant-numeric:tabular-nums}
.pkg-abi{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-2);margin-top:2px}
.pkg-desc{font-size:var(--fs-sm);color:var(--text-2);margin:var(--s-2) 0 var(--s-3)}
.pkg-actions{display:flex;gap:var(--s-2)}
.pkg-actions .btn{flex:1}
/* 文件完整性校验：展示官方 md5/sha256 + 浏览器端算 sha256 比对 */
.pkg-verify{margin-top:var(--s-2);display:flex;flex-direction:column;gap:var(--s-1)}
.verify-btn{align-self:flex-start;background:none;border:1px dashed var(--border-strong);color:var(--text-2);border-radius:var(--r-sm);padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;transition:.15s}
.verify-btn:hover{color:var(--text);border-color:var(--text-2);background:var(--surface)}
.verify-btn:disabled{opacity:.6;cursor:progress}
.verify-result{font-size:12px;line-height:1.7;color:var(--text-2);word-break:break-all}

/* =====================================================================
   骨架 loading：.sk（加载中占位）
   空状态：.state（无版本 / 无安装包）
   错误状态：.state.state-error（带重试）
   ===================================================================== */
.sk{display:block;border-radius:var(--r-1);background:linear-gradient(90deg,var(--surface-3) 0%,var(--border) 50%,var(--surface-3) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}

.sk-ver{width:55%;height:40px}

.sk-pkg{height:132px;border-radius:var(--r-2);margin-bottom:var(--s-3)}
.state{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-2);padding:var(--s-5);border:1px dashed var(--border-strong);border-radius:var(--r-2);color:var(--text-2)}
.state .ic{width:22px;height:22px;color:var(--text-2)}
.state-title{font-weight:600;color:var(--text)}
.state-desc{font-size:var(--fs-sm)}
.state .btn{margin-top:var(--s-2)}
.state-error{border-style:solid;border-color:var(--err-border);background:var(--err-bg)}
.state-error .ic,.state-error .state-title{color:var(--err)}
.inline-error{display:flex;gap:var(--s-2);align-items:flex-start;color:var(--err);font-size:var(--fs-sm)}
.inline-error .ic{margin-top:2px}

/* =====================================================================
   链接 .link
   default / hover / focus-visible / active
   ===================================================================== */
.foot{border-top:1px solid var(--border);padding:var(--s-4) var(--s-6);display:flex;flex-direction:column;gap:var(--s-2);background:var(--surface)}
.foot-links{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-4)}
.link{display:inline-flex;align-items:center;gap:var(--s-1);font-size:var(--fs-sm);color:var(--text-2);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;border-radius:4px;transition:color var(--t) var(--ease),text-decoration-color var(--t) var(--ease),box-shadow var(--t-fast) var(--ease)}
.link:hover{color:var(--text);text-decoration-color:currentColor}
.link:active{color:var(--text-2);text-decoration-color:currentColor;opacity:.8}
.link:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--focus)}
.foot-note{font-size:var(--fs-xs);color:var(--text-2)}

  // 去掉：所有表格、代码块/日志、"Full Changelog" 行、每条末尾的 (#数字)、以及残留的空括号
  function cleanNote(md){
    var lines=md.replace(/\r/g,'').split('\n');
    var out=[], inTable=false, inCode=false;
    for(var i=0;i<lines.length;i++){
      var L=lines[i];
      // 代码块/日志：``` 围栏，整块跳过
      if(/^\s*```/.test(L)){ inCode=!inCode; continue; }
      if(inCode) continue;
      // 任意表格：表头含 | 且下一行是分隔行 -> 整块跳过（包名表、API 变更表等所有表格）
      if(!inTable && L.indexOf('|')!==-1 && (lines[i+1]||'').indexOf('-')!==-1 && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]||'')){ inTable=true; continue; }
      if(inTable){
        if(/^\s*\|?[\s:|-]+\|?\s*$/.test(L)) continue;                    // 分隔行
        if(L.indexOf('|')!==-1 && !/^\s*$/.test(L)) continue;             // 表体行
        inTable=false;
      }
      if(/Full\s+Changelog/i.test(L)) continue;                           // Full Changelog 行
      out.push(L);
    }
    return out.join('\n');
  }
  // 渲染后清理行尾的 issue 引用与空括号
  function stripRefs(html){
    return html
      .replace(/<a\s+[^>]*href="[^"]*\/(?:issues|pull)\/\d+"[^>]*>[\s\S]*?<\/a>/gi,'')
      .replace(/<a[^>]*>\s*#\d+\s*<\/a>/gi,'')
      .replace(/[（(]\s*(?:#\d+|\d+)\s*[）)]\s*/g,'')
      .replace(/[（(]\s*[\s\S]*?\s*#\d+\s*[\s\S]*?\s*[）)]\s*/g,'')
      .replace(/\s*#\d+/g,'')
      .replace(/[（(]\s*[）)]/g,'')
      .replace(/[（(]\s*<br\s*\/?>\s*[）)]/gi,'')
      .replace(/[（(]\s*[）)]\s*/g,'')
      .replace(/\s{2,}/g,' ')
      .replace(/[ \t]+([。\.!?！？])/g,'$1');
  }

  /* ---------- 轻量 Markdown 渲染 ---------- */
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    return esc(s)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/|#)[^)]*)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  }
  function splitRow(row){
    row=row.trim();
    if(row.charAt(0)==='|') row=row.slice(1);
    if(row.charAt(row.length-1)==='|') row=row.slice(0,-1);
    return row.split('|').map(function(c){return c.trim();});
  }
  function renderMD(md){
    if(window.markdownit) return window.markdownit({html:false}).render(md);
    var lines=md.replace(/\r/g,'').split('\n');
    var out=[], i=0;
    while(i<lines.length){
      var line=lines[i];
      if(line.indexOf('|')!==-1 && (lines[i+1]||'').indexOf('-')!==-1 && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]||'')){
        var header=splitRow(line); i+=2;
        var rows=[];
        while(i<lines.length && lines[i].indexOf('|')!==-1 && !/^\s*$/.test(lines[i])){ rows.push(splitRow(lines[i])); i++; }
        var t='<table><thead><tr>';
        header.forEach(function(c){t+='<th>'+inline(c)+'</th>';});
        t+='</tr></thead><tbody>';
        rows.forEach(function(r){ t+='<tr>'; header.forEach(function(_,ci){ t+='<td>'+inline(r[ci]||'')+'</td>'; }); t+='</tr>'; });
        t+='</tbody></table>';
        out.push(t); continue;
      }
      if(/^\s*([-*_])\s*(?:\1\s*){2,}$/.test(line)){ out.push('<hr>'); i++; continue; }
      var hm=line.match(/^(#{1,6})\s+(.+)$/);
      if(hm){ var lv=Math.min(hm[1].length+1,6); out.push('<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>'); i++; continue; }
      if(/^\s*[-*+]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)){
        var ordered=/^\s*\d+\.\s+/.test(line);
        var items=[];
        while(i<lines.length && (/^\s*[-*+]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))){
          items.push(lines[i].replace(/^\s*(?:[-*+]|\d+\.)\s+/,'')); i++;
        }
        var tag=ordered?'ol':'ul', l='<'+tag+'>';
        items.forEach(function(it){ l+='<li>'+inline(it)+'</li>'; });
        out.push(l+'</'+tag+'>'); continue;
      }
      if(/^\s*$/.test(line)){ i++; continue; }
      // 引用块：连续以 > 开头的行（含 GitHub 告警卡片 > [!NOTE] 等）
      if(/^\s*>/.test(line)){
        var q=[];
        while(i<lines.length && /^\s*>/.test(lines[i])){
          q.push(lines[i].replace(/^\s*>\s?/,'')); i++;
        }
        var alertM=(q[0]||'').match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
        if(alertM){
          var type=alertM[1].toUpperCase();
          var rest=alertM[2]||'';
          if(/^\s*$/.test(rest)) q.shift();
          else q[0]=rest;
          var body=q.filter(function(x){return !/^\s*$/.test(x);}).map(inline).join('<br>');
          out.push('<div class="md-alert md-alert--'+type.toLowerCase()+'"><div class="md-alert-title">'+type+'</div><div class="md-alert-body">'+body+'</div></div>');
        } else {
          var qbody=q.filter(function(x){return !/^\s*$/.test(x);}).map(inline).join('<br>');
          out.push('<blockquote>'+qbody+'</blockquote>');
        }
        continue;
      }
      var para=[];
      while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^\s*(?:[-*+]|\d+\.)\s+/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !/^\s*>/.test(lines[i]) && lines[i].indexOf('|')===-1){
        para.push(lines[i]); i++;
      }
      if(para.length){ out.push('<p>'+para.map(inline).join('<br>')+'</p>'); }
      else { i++; }
    }
    return out.join('\n');
  }

  /* ---------- 链接构造（文件名带 v = tag） ---------- */
  function ghUrl(tag,key,owner,repo,fname){ return 'https://github.com/'+(owner||GH_OWNER)+'/'+(repo||GH_REPO)+'/releases/download/'+tag+'/'+(fname||('AiVerse-'+key+'-'+tag))+'.apk'; }
  function mirrorUrl(idx,tag,key){ return MIRRORS[idx].build(tag,key); }

  /* ---------- 下载按钮结构：图标槽同时容纳 default / loading / success ---------- */
  function dlBtn(cls,href,label,signFile){
    return '<a class="btn '+cls+'" href="'+href+'" download'+(signFile?' data-sign="'+signFile+'"':'')+'>'
      +'<span class="btn-ic">'+ICON('download','i-dl')+'<i class="spin"></i>'+ICON('check','i-check')+'</span>'
      +'<span class="btn-label">'+label+'</span></a>';
  }

  /* ---------- 渲染安装包（一个架构一个按钮） ---------- */
  function renderPkgs(rel){
    var tag=rel.tag_name;
    var assets=rel.assets||[];
    var html='';
    PKGS.forEach(function(p){
      var a=assets.filter(function(x){return x.name.toLowerCase().indexOf(p.key)!==-1;})[0];
      if(!a) return;
      var mb=(a.size/1024/1024).toFixed(1);
      var head='<article class="pkg'+(p.rec?' is-rec':'')+'" data-key="'+p.key+'">'
        +'<div class="pkg-top"><div class="pkg-id"><span class="pkg-name">'+p.name+'</span>'+(p.rec?'<span class="tag">推荐</span>':'')+'</div><span class="pkg-size">'+mb+' MB</span></div>'
        +'<div class="pkg-abi">'+p.abi+'</div>'
        +'<p class="pkg-desc">'+p.desc+'</p>';
      var main=p.rec?'btn-primary':'btn-secondary';

      var isTestCh=state.channel==='test';
      if(isTestCh){
        // 测试版：独立仓库 yhdmgf/aiverse-beta，文件名不带版本号（-beta）
        // 与其他通道一致：直连模式只显示直连按钮，镜像模式只显示镜像按钮（测试版仅一个 gh 镜像）
        var tf='AiVerse-'+p.key+'-beta';
        var tgh=ghUrl(tag,p.key,TEST_OWNER,TEST_REPO,tf);
        if(state.source==='github'){
          html+=head+'<div class="pkg-actions">'+dlBtn(main,tgh,'GitHub 直连下载')+'</div></article>';
        } else {
          html+=head+'<div class="pkg-actions">'+dlBtn(main,'https://gh.aivapp.cn/'+tgh,'镜像下载')+'</div></article>';
        }
      } else {
        // 正式版/预览版：本站为主（/apk/，文件名与 GitHub Release 一致）+ GitHub 直连备用，不再使用镜像一/二
        // 本站下载走签名：file 为本站相对路径，由签发端换签名临时链接
        var siteFile='/apk/'+a.name;
        var siteUrl='https://www.aivapp.cn'+siteFile;
        html+=head+'<div class="pkg-actions">'
          +dlBtn(main,siteUrl,'本站下载',siteFile)
          +dlBtn('btn-secondary',ghUrl(tag,p.key),'GitHub 直连')
          +'</div>'
          +'<div class="pkg-verify" data-file="'+siteFile+'">'
            +'<button type="button" class="verify-btn">校验文件完整性</button>'
            +'<div class="verify-result" hidden></div>'
          +'</div></article>';
      }
    });
    if(!html) html=emptyState('该版本未找到安装包资源','这个版本没有附带可用的安装包，请切换通道或前往发布页查看。');
    $('pkgs').innerHTML=html;
  }

  /* ---------- 空状态 / 错误状态 / 骨架 ---------- */
  function emptyState(title,desc,action){
    return '<div class="state">'+ICON('box')+'<div class="state-title">'+title+'</div><div class="state-desc">'+desc+'</div>'+(action||'')+'</div>';
  }
  function errorState(title,desc){
    return '<div class="state state-error" role="alert">'+ICON('alert')+'<div class="state-title">'+title+'</div><div class="state-desc">'+desc+'</div>'
      +'<button class="btn btn-secondary" type="button" data-action="retry"><span class="btn-ic">'+ICON('refresh','i-dl')+'<i class="spin"></i>'+ICON('check','i-check')+'</span><span class="btn-label">重试</span></button></div>';
  }
  function showSkeleton(){
    $('verBig').innerHTML='<span class="sk sk-ver"></span>';
    $('verMeta').innerHTML='<span class="sk sk-line" style="width:70%"></span>';
    $('releaseNote').innerHTML='<span class="sk sk-line" style="width:90%"></span><span class="sk sk-line" style="width:75%"></span><span class="sk sk-line" style="width:82%"></span><span class="sk sk-line" style="width:48%"></span>';
    $('pkgs').innerHTML='<span class="sk sk-pkg"></span><span class="sk sk-pkg"></span>';
  }

  /* ---------- 分段控件：滑块定位 / 可用性 ---------- */
  function positionThumb(sw,animate){
    var active=sw.querySelector('.switch-btn.active');
    var thumb=sw.querySelector('.thumb');
    if(!active||!thumb) return;
    if(!animate) sw.classList.add('no-anim');
    thumb.style.transform='translateX('+active.offsetLeft+'px)';
    thumb.style.width=active.offsetWidth+'px';
    thumb.classList.add('ready');
    if(!animate){ void thumb.offsetWidth; sw.classList.remove('no-anim'); }
  }
  function initThumbs(instant){
    positionThumb($("channelSwitch"),!instant);
    positionThumb($("sourceSwitch"),!instant);
  }
  function syncSwitch(sw){
    sw.querySelectorAll('.switch-btn').forEach(function(x){ x.setAttribute('aria-checked',x.classList.contains('active')?'true':'false'); x.tabIndex=x.classList.contains('active')?0:-1; });
  }
  function setBusy(b){                                                    // 数据未就绪：禁用两个分段控件
    document.querySelectorAll('.switch-btn').forEach(function(x){ x.disabled=b; });
  }

  /* ---------- 测试版内容同步：从 body 抓 commit，对比主仓库 main 最新提交 ---------- */
  function extractCommit(body){
    var m = /commit\s+([0-9a-f]{7,40})/i.exec(body||'');
    return m ? m[1] : '';
  }
  function renderVerSync(body){
    var box = $('verSync');
    var testCommit = extractCommit(body);
    if(!testCommit){ box.hidden = true; return; }        // body 无 commit，不显示
    var shortTest = testCommit.slice(0,7);
    box.hidden = false;
    box.className = 'ver-sync';
    box.innerHTML = '<div class="vs-row"><span class="vs-dot"></span><span class="vs-title">正在检查测试版是否为最新…</span></div>';
    fetch(MAIN_COMMIT_API)
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(c){
        var mainSha = (c && c.sha) ? String(c.sha) : '';
        if(!mainSha){ box.hidden = true; return; }
        var shortMain = mainSha.slice(0,7);
        var same = (mainSha.slice(0, testCommit.length).toLowerCase() === testCommit.toLowerCase());
        if(same){
          box.className = 'ver-sync ok';
          box.innerHTML = '<div class="vs-row"><span class="vs-dot"></span><span class="vs-title">测试版已是最新</span></div>'
            + '<div class="vs-sub">构建 commit <span class="vs-hash">'+shortTest+'</span> 与主仓库最新提交一致</div>';
        } else {
          box.className = 'ver-sync behind';
          box.innerHTML = '<div class="vs-row"><span class="vs-dot"></span><span class="vs-title">测试版已落后于主仓库</span></div>'
            + '<div class="vs-sub">构建 commit <span class="vs-hash">'+shortTest+'</span> · 主仓库最新 <span class="vs-hash">'+shortMain+'</span></div>'
            + '<div class="vs-sub">请<a href="https://aivapp.cn/trigger/" target="_blank" rel="noopener noreferrer">手动触发一次</a>，以获得最新测试版</div>';
        }
      })
      .catch(function(){ box.hidden = true; });          // 查询失败则静默隐藏，不打扰
  }

  /* ---------- 渲染全部 ---------- */
  function renderAll(){
    var isTest=state.channel==='test';
    var isBeta=state.channel==='beta';
    if(!isTest && !state.data) return;
    var rel = isTest ? state.test : (isBeta ? state.data.beta : state.data.stable);
    var chName = isTest?'测试版':(isBeta?'预览版':'正式版');
    var badge=$('channelBadge');
    badge.className='badge '+(isTest?'test':(isBeta?'beta':'stable'));
    badge.textContent=chName;
    // 正式版/预览版不再使用镜像，隐藏“下载源”切换；仅测试版显示并可切 GitHub 直连/镜像
    $('sourceGroup').hidden=!isTest;
    var tip=$('mirrorTip');
    if(isTest && state.source==='mirror'){
      tip.hidden=false;
      $('mirrorTipText').innerHTML='测试版镜像为本站加速（gh.aivapp.cn），仅此一个镜像。';
    } else {
      tip.hidden=true;
    }
    if(isTest) positionThumb($('sourceSwitch'),false);

    if(!rel){
      $('verBig').textContent = '暂无'+chName;
      $('verMeta').textContent='';
      $('releaseNote').innerHTML='<p>该通道暂时没有可用版本，请切换另一通道。</p>';
      var otherCh = isTest?'预览版':(isBeta?'正式版':'预览版');
      $('pkgs').innerHTML=emptyState('暂无'+chName,'该通道暂时没有可用安装包。',
        '<button class="btn btn-secondary" type="button" data-action="other-channel">切换到'+otherCh+'</button>');
      initThumbs();
      return;
    }
    var v=rel.tag_name;
    $('infoTitle').textContent='版本信息';
    var d=new Date(rel.published_at);
    var dateStr=isNaN(d)?'':d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
    $('verMeta').textContent='发布于 '+dateStr+(isTest?' · 内部测试版，仅供内部使用':(isBeta?' · 预览版本，可能不稳定':' · 推荐日常使用'));
    if(isTest){
      // 测试版：版本号右侧加"测试版"标记（测试版号≠最终版本号）
      $('verBig').innerHTML='';
      var vText=document.createElement('span'); vText.textContent=v;
      var vBadge=document.createElement('span'); vBadge.className='ver-test-badge'; vBadge.textContent='测试版';
      $('verBig').appendChild(vText); $('verBig').appendChild(vBadge);
      // 测试版：隐藏顶部"版本信息"标题（避免与下方 notesTitle"版本信息"重复），通道名由 verBig 旁"测试版"标记体现
      $('infoEyebrow').hidden=true;
      // 测试版左栏标题用"版本信息"（其余通道保持"更新日志"）
      $('notesTitle').textContent='版本信息';
      // 内容同步状态：对比 beta 构建 commit 与主仓库 main 最新提交
      renderVerSync(rel.body);
    } else {
      $('infoEyebrow').hidden=false;
      $('verBig').textContent=v;
      $('notesTitle').textContent='更新日志';
      $('verSync').hidden=true;
    }
    $('releaseNote').innerHTML=stripRefs(renderMD(cleanNote(rel.body||'（暂无更新日志）')));

    renderPkgs(rel);
    initThumbs();
  }

  /* ---------- 事件 ---------- */
  function bindSwitch(id,key,apply){
    var sw=$(id);
    sw.addEventListener('click',function(e){
      var b=e.target.closest('.switch-btn'); if(!b||b.disabled||b.classList.contains('active')) return;
      // 测试版通道：先弹窗确认（勾选三个已知悉 + 确认才切换；点 × 关闭则不切换）
      if(id==='channelSwitch' && b.dataset.channel==='test'){ showTestModal(); return; }
      sw.querySelectorAll('.switch-btn').forEach(function(x){x.classList.remove('active')});
      b.classList.add('active');
      apply(b.dataset[key]);
      syncSwitch(sw);
      renderAll();
    });
    sw.addEventListener('keydown',function(e){                            // 方向键在分段内移动
      if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
      var btns=[].slice.call(sw.querySelectorAll('.switch-btn')), i=btns.indexOf(document.activeElement);
      if(i<0) return; e.preventDefault();
      var n=btns[(i+(e.key==='ArrowRight'?1:-1)+btns.length)%btns.length];
      if(!n.disabled){ n.focus(); n.click(); }
    });
  }
  bindSwitch('channelSwitch','channel',function(v){ state.channel=v; });
  // 下载源：二选一（直连 / 镜像），镜像模式每个包固定镜像一/镜像二双按钮
  bindSwitch('sourceSwitch','source',function(v){ state.source=v; });

  /* ---------- 测试版确认弹窗（事件只绑一次）---------- */
  var testModal=$('testModal');
  var testChecks=[].slice.call(testModal.querySelectorAll('[data-ack]'));
  var testConfirmBtn=testModal.querySelector('[data-action="confirm-test"]');
  var testCloseBtn=testModal.querySelector('[data-action="close-test"]');
  function updateTestConfirm(){
    var all=testChecks.length>0 && testChecks.every(function(c){return c.checked});
    testConfirmBtn.disabled=!all;
  }
  testChecks.forEach(function(c){ c.addEventListener('change',updateTestConfirm); });
  function showTestModal(){
    testChecks.forEach(function(c){c.checked=false});
    testConfirmBtn.disabled=true;
    testModal.hidden=false;
    requestAnimationFrame(function(){ testModal.classList.add('open'); });
    document.documentElement.classList.add('is-locked');
  }
  function closeTestModal(){
    testModal.classList.remove('open');
    document.documentElement.classList.remove('is-locked');
    setTimeout(function(){ testModal.hidden=true; },200);
  }
  testConfirmBtn.addEventListener('click',function(){
    state.channel='test';
    state.testUnlocked=true;                       // 已确认 → 解锁下载
    closeTestModal();
    var sw=$('channelSwitch');
    sw.querySelectorAll('.switch-btn').forEach(function(x){x.classList.remove('active')});
    sw.querySelector('[data-channel="test"]').classList.add('active');
    syncSwitch(sw);
    renderAll();
  });
  testCloseBtn.addEventListener('click',closeTestModal);          // 点 × → 不切换（保持原通道）
  testModal.addEventListener('click',function(e){ if(e.target===testModal) closeTestModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !testModal.hidden) closeTestModal(); });

  window.addEventListener('resize',function(){ initThumbs(true); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ initThumbs(true); });

  /* ---------- 下载点击反馈：loading → success → 复位（不拦截原生下载） ---------- */
  $('pkgs').addEventListener('click',function(e){
    var b=e.target.closest('a.btn'); if(!b||b.classList.contains('is-loading')||b.classList.contains('is-success')) return;
    var label=b.querySelector('.btn-label'), old=label.textContent;
    var signFile=b.getAttribute('data-sign');
    var sibs=[].filter.call(b.parentNode.querySelectorAll('a.btn'),function(x){return x!==b;});
    sibs.forEach(function(s){ s.setAttribute('aria-disabled','true'); });
    b.classList.add('is-loading');
    // 本站 APK：先调签发端拿签名临时链接再跳转；失败按文案提示并恢复按钮
    if(signFile){
      e.preventDefault();
      label.textContent='正在准备下载…';
      fetch(SIGN_API+'?file='+encodeURIComponent(signFile))
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(function(d){
          if(!d || !d.url) throw new Error('no url');
          window.location.href=d.url;
          b.classList.remove('is-loading'); b.classList.add('is-success'); label.textContent='已开始下载';
          $('sr').textContent='已开始下载';
          setTimeout(function(){
            b.classList.remove('is-success'); label.textContent=old;
            sibs.forEach(function(s){ s.removeAttribute('aria-disabled'); });
          },2200);
        })
        .catch(function(){
          b.classList.remove('is-loading'); b.classList.add('is-error');
          label.textContent='下载链接生成失败，请稍后重试';
          setTimeout(function(){
            b.classList.remove('is-error'); label.textContent=old;
            sibs.forEach(function(s){ s.removeAttribute('aria-disabled'); });
          },2800);
        });
      return;
    }
    // 第三方渠道：保持原生跳转，仅做加载/成功反馈
    label.textContent='准备下载…';
    setTimeout(function(){
      b.classList.remove('is-loading'); b.classList.add('is-success'); label.textContent='已开始下载';
      $('sr').textContent='已开始下载';
      setTimeout(function(){
        b.classList.remove('is-success'); label.textContent=old;
        sibs.forEach(function(s){ s.removeAttribute('aria-disabled'); });
      },2200);
    },700);
  });
  /* ---------- 文件完整性校验：取官方哈希 + 浏览器端算 SHA-256 比对 ---------- */
  $('pkgs').addEventListener('click',function(e){
    var vb=e.target.closest('.verify-btn'); if(!vb) return;
    e.preventDefault();
    var wrap=vb.closest('.pkg-verify'), file=wrap.getAttribute('data-file');
    var resultEl=wrap.querySelector('.verify-result');
    vb.disabled=true; var vbOld=vb.textContent; vb.textContent='正在校验…';
    resultEl.hidden=false; resultEl.innerHTML='<div class="vstatus">正在获取官方校验值…</div>';
    var done=function(){ vb.disabled=false; vb.textContent=vbOld; };
    if(!window.crypto||!crypto.subtle||!window.fetch){
      resultEl.innerHTML='<div class="vstatus bad">当前浏览器不支持完整性校验，请使用现代浏览器。</div>';
      done(); return;
    }
    // 1）取官方校验值（走签发端，同时拿到签名下载链接）
    fetch(SIGN_API+'?file='+encodeURIComponent(file))
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){
        if(!d||!d.sha256||!d.url) throw new Error('no hash');
        resultEl.innerHTML='<div class="sums">MD5 <code>'+d.md5+'</code></div>'
          +'<div class="sums">SHA-256 <code>'+d.sha256+'</code></div>'
          +'<div class="vstatus">正在计算本地文件校验值，请稍候…</div>';
        // 2）用签名链接取文件，浏览器端算 SHA-256 与官方值比对
        return fetch(d.url).then(function(fr){ if(!fr.ok) throw new Error('HTTP '+fr.status); return fr.arrayBuffer(); })
          .then(function(buf){ return crypto.subtle.digest('SHA-256',buf); })
          .then(function(dig){
            var hex=Array.prototype.map.call(new Uint8Array(dig),function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
            var ok=(hex===d.sha256);
            resultEl.insertAdjacentHTML('beforeend','<div class="vstatus '+(ok?'ok':'bad')+'">'+(ok?'✓ 校验通过：文件与官方发布一致':'✗ 校验失败：文件可能已损坏或被篡改')+'</div>');
          });
      })
      .catch(function(err){
        resultEl.innerHTML='<div class="vstatus bad">校验未完成：'+(err&&err.message?err.message:'请稍后重试')+'</div>';
      })
      .then(done,done);
  });
  // 空状态 / 错误状态内的操作
  $('pkgs').addEventListener('click',function(e){
    var a=e.target.closest('[data-action]'); if(!a) return;
    if(a.dataset.action==='other-channel'){
      var t=state.channel==='stable'?'beta':'stable';
      $('channelSwitch').querySelector('[data-channel="'+t+'"]').click();
    } else if(a.dataset.action==='retry'){
      a.classList.add('is-loading'); a.querySelector('.btn-label').textContent='重试中…';
      load(a);
    }
  });

  /* ---------- 拉取数据 ---------- */
  function load(retryBtn){
    setBusy(true); showSkeleton();
    fetch(API)
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(rs){
        if(!rs || !rs.length){
          $('verBig').textContent='暂无版本';
          $('verMeta').textContent=''; $('releaseNote').innerHTML='';
          $('pkgs').innerHTML=emptyState('仓库暂无 Release','发布后这里会出现可下载的安装包。');
          initThumbs(); return;
        }
        var stable=rs.find(function(r){return !r.prerelease && !r.draft}) || null;
        var beta=rs.find(function(r){return r.prerelease && !r.draft}) || null;
        state.data={stable:stable, beta:beta};
        if(!stable && beta){
          state.channel='beta';
          $('channelSwitch').querySelectorAll('.switch-btn').forEach(function(x){ x.classList.toggle('active', x.dataset.channel==='beta'); });
        }
        setBusy(false); syncSwitch($('channelSwitch')); syncSwitch($('sourceSwitch'));
        renderAll();
        loadTest();
      })
      .catch(function(){
        $('verBig').textContent='加载失败'; $('verMeta').textContent='';
        $('releaseNote').innerHTML='<div class="inline-error">'+ICON('alert','ic-sm')+'<span>无法连接 GitHub API，请检查网络后重试。</span></div>';
        $('pkgs').innerHTML=errorState('无法获取安装包','请检查网络连接后再试，或直接前往下方的发布页下载。');
        var nb=$('pkgs').querySelector('[data-action="retry"]'); if(nb&&retryBtn){ nb.classList.add('is-error'); setTimeout(function(){ nb.classList.remove('is-error'); },1600); }
        initThumbs();
      });
  }

  /* ---------- 拉取测试版（独立仓库 yhdmgf/aiverse-beta）---------- */
  function loadTest(){
    fetch(TEST_API)
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(rel){ state.test=(rel && !rel.draft)?rel:null; if(state.channel==='test') renderAll(); })
      .catch(function(){ state.test=null; if(state.channel==='test') renderAll(); });
  }

  syncSwitch($('channelSwitch')); syncSwitch($('sourceSwitch'));
  load();
  // 下载界面已作为页面主体直接展示。
})();

/* =====================================================================
   设计说明
   布局采用“非对称双栏 + 分层”：左栏是偏灰的上下文层（版本号衬线大字、更新日志），
   右栏是操作层（通道 → 下载源 → 安装包），让“读”和“做”在视觉上分离；移动端自动
   转为底部浮层。视觉权重刻意不均：只有推荐的 ARM64 使用墨色主按钮与“推荐”标签，
   其余包与镜像二降为描边按钮，避免所有元素同等抢眼。
   状态设计以“明度/描边/小图形”区分而非高饱和色：focus-visible 使用两层墨色环
   （表面色间隔 + 墨色外环），不依赖浏览器默认蓝色光环；loading 用按钮内嵌 spinner，
   success 以绿色浅底 + 对勾，error/empty 用独立状态块（错误块自带重试），首次加载用骨架。
   模态与右栏高度固定且只动画 transform/opacity，切换通道时内容在内部滚动区变化，面板
   与滑块都不会引起布局跳动；所有状态过渡为 120–200ms，间距全部来自 4/8/12/16/24/32 令牌。
   ===================================================================== */
</script>
</body>
</html>

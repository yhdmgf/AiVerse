name: Nightly Build

# 每天（北京时间）自动构建最新 main 的 beta 测试包（三架构）并发布到测试版仓库 Release。
# 目的：测试的人随时能拿到最新构建，且能尽早发现编译挂了。
# 产物发到独立测试版仓库 yhdmgf/aiverse-beta 的 Releases（版本号自动递增），不再作为 Actions artifact。
# beta = 继承 release 的正式签名 + R8，包名 com.aiverse.beta（与正式版同机共存、互不覆盖）；
# 签名校验生效，但测试包不参与检查更新（见 SettingsViewModel.isTestPackage），不会把测试机导向正式包。
on:
  schedule:
    # 北京时间 6:00 / 12:00 / 18:00（= UTC 前一天22:00 / 当天4:00 / 10:00）
    - cron: '0 22 * * *'  # 北京 6:00
    - cron: '0 4 * * *'   # 北京 12:00
    - cron: '0 10 * * *'  # 北京 18:00
    - cron: '0 16 * * *'  # 北京 0:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 迁移对账
        run: python3 scripts/check_migrations.py

      # beta 继承 release 的签名配置，需先从仓库 Secrets 还原签名密钥（与 android-release.yml 一致，不入库）。
      - name: 还原 release 签名（从仓库 Secrets 注入）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KEYSTORE_B64" | base64 -d > app/AiVerse.jks
          printf 'storeFile=AiVerse.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties

      # 三架构 beta 包：universal（通用，含 arm+x86 两套镜像）/ armsolo（arm64 真机）/ x86solo（x86_64 模拟器）
      - name: 构建 beta 测试包（三架构，正式签名）
        run: |
          ./gradlew :app:assembleUniversalBeta :app:assembleArmsoloBeta :app:assembleX86soloBeta

      - name: 收集产物
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/universal/beta/app-universal-beta.apk "dist/AiVerse-universal-beta.apk"
          cp app/build/outputs/apk/armsolo/beta/app-armsolo-beta.apk "dist/AiVerse-arm64-beta.apk"
          cp app/build/outputs/apk/x86solo/beta/app-x86solo-beta.apk "dist/AiVerse-x86_64-beta.apk"

          # 说明 txt：测试版声明 + 包含的三个 APK + 本次 commit
          SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          cat > "dist/使用说明.txt" <<EOF
          AiVerse 测试版（Beta）安装说明
          =================================

          【请先阅读】
          测试版不代表最终版本，仅供内部测试体验。
          请勿二次分发、转包、上传或分享给他人，禁止用于商业用途。
          测试包不参与应用内检查更新，不会触发覆盖正式版的升级提示。

          本次构建
          - commit：$SHA
          - 构建时间：$BUILD_TIME
          - 包名：com.aiverse.beta（可与正式版同机共存，互不覆盖）

          安装包选择
          本次提供三个 APK，请按设备类型选择安装：

          - AiVerse-universal-beta.apk
            通用版，包含 arm + x86 两套镜像，体积最大，任意设备可安装。
            不确定设备架构时，优先选择此版本。

          - AiVerse-arm64-beta.apk
            arm64 真机版，绝大多数真机选择此版本，体积最小。

          - AiVerse-x86_64-beta.apk
            x86_64 模拟器版，模拟器选择此版本。

          正式版下载
          https://aivapp.cn/download

          官方仓库
          https://github.com/yhdmgf/aiverse

          安装前请确认设备架构；如不确定，建议安装 universal 通用版。
          EOF
          # heredoc 正文必须与 run: | 块缩进一致（顶格会破坏 YAML），
          # 故写入后再剥掉行首 10 空格，让 txt 内容真正顶格。
          sed -i 's/^          //' "dist/使用说明.txt"
          touch -d "1949-10-01 00:00:00" "dist/使用说明.txt"

          ls -la dist/

      - name: 输出构建信息到运行摘要
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "## Nightly 构建（beta 测试包）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 构建: beta（正式签名 + R8，包名 com.aiverse.beta，与正式版独立共存）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 三架构: universal / arm64 / x86_64" >> "$GITHUB_STEP_SUMMARY"
          echo "- 测试包不参与检查更新（无应用内升级，避免导向正式包）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 下载: 下方三个 APK 资产（按设备类型选）+ 使用说明.txt" >> "$GITHUB_STEP_SUMMARY"

      # 三架构 APK 各自独立 + 测试版说明 txt，作为测试版仓库 Release 的资产。
      - name: 发布到测试版仓库 Releases
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          TARGET_REPO: yhdmgf/aiverse-beta
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)

          # 枚举所有 tags 取最大版本号（比 gh release view 取 latest 更稳，避免首次/空 latest 误判），按 1.0.x 递增（patch 满 99 进位到 2.0.0）
          PREV=$(gh api "repos/$TARGET_REPO/tags" --paginate --jq '.[].name' 2>/dev/null \
                  | sed 's/^v//' | sort -V | tail -n1)
          echo "上一个版本: ${PREV:-无（首次发布）}"
          if [ -z "$PREV" ]; then
            MAJOR=1; MINOR=0; PATCH=0
          else
            BASE=${PREV%%-*}
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            MAJOR=${MAJOR:-1}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          fi
          PATCH=$((PATCH + 1))
          # patch 到 99 为一轮上限，下一版直接进位到下一个 major（如 1.0.99 -> 2.0.0）
          if [ "$PATCH" -ge 100 ]; then PATCH=0; MINOR=0; MAJOR=$((MAJOR + 1)); fi
          VER="${MAJOR}.${MINOR}.${PATCH}"
          echo "本次发布版本: $VER"

          # 兕底：若同 tag 的 release/tag 已存在（如上次构建残留），先删干净再建新，避免撞车失败
          if gh release view "$VER" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "检测到已存在 release $VER，先删除（release + tag）后重建"
            gh release delete "$VER" --repo "$TARGET_REPO" --yes --cleanup-tag
          fi

          # 三个 APK 各自独立上传为 release 资产（文件名固定，不带版本号），附使用说明 txt
          gh release create "$VER" \
            --repo "$TARGET_REPO" \
            --title "AiVerse 测试版 $VER" \
            --notes "测试版构建（commit $SHA）。三架构 APK 见下方资产，按设备类型选择安装。测试版不代表最终版本，请勿二传。" \
            "dist/AiVerse-universal-beta.apk" \
            "dist/AiVerse-arm64-beta.apk" \
            "dist/AiVerse-x86_64-beta.apk" \
            "dist/使用说明.txt"

          echo "## Nightly 构建（beta 测试包）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本: \`$VER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 发布: [yhdmgf/aiverse-beta Releases](https://github.com/yhdmgf/aiverse-beta/releases)" >> "$GITHUB_STEP_SUMMARY"

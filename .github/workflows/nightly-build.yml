name: Nightly Build

# 每天（北京时间）自动构建最新 main 的 beta 测试包（三架构）并发布到测试版仓库 Release。
# 目的：测试的人随时能拿到最新构建，且能尽早发现编译挂了。
# 产物发到独立测试版仓库 yhdmgf/aiverse-beta 的 Releases（版本号自动递增），不再作为 Actions artifact。
# beta = 继承 release 的正式签名 + R8，包名 com.aiverse.beta（与正式版同机共存、互不覆盖）；
# 签名校验生效，但测试包不参与检查更新（见 SettingsViewModel.isTestPackage），不会把测试机导向正式包。
#
# 多 job 结构，只在「构建」处并行化（三个 APK 三个 job 同时跑，省总时长），与 android-release.yml 对齐：
#   prepare —— 计算版本号 + 早退检测 + JDK + 迁移/插件对账（只跑一次），产出 ver/tag/sha/skip/prev_sha 供下游复用
#   build   —— matrix 三个 beta 包（universal / armsolo / x86solo）并行构建，各自 upload-artifact
#   release —— needs: [prepare, build]，等三个产物全部就绪后 download-artifact 汇总、拼 README、发布到测试版仓库
on:
  schedule:
    # 北京时间 6:00 / 12:00 / 18:00（= UTC 前一天22:00 / 当天4:00 / 10:00）
    - cron: '0 22 * * *'  # 北京 6:00
    - cron: '0 4 * * *'   # 北京 12:00
    - cron: '0 10 * * *'  # 北京 18:00
    - cron: '0 16 * * *'  # 北京 0:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 阶段 1：准备。版本号自增 / 早退判重 / 迁移对账 / 插件对账只跑一次，结果通过 outputs 传给下游，
  #    避免 matrix 三个 runner 各自重复解析版本、重复做对账。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      # 下游消费：ver/tag 供发布段拼 tag 与版本名；sha/full_sha 供 README、摘要、release body 写 commit；
      # skip 供 build/release 判断是否早退；prev_sha 供发布段生成 changelog 基线。
      ver: ${{ steps.ver.outputs.ver }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
      full_sha: ${{ steps.earlycheck.outputs.full_sha }}
      skip: ${{ steps.earlycheck.outputs.skip }}
      prev_sha: ${{ steps.earlycheck.outputs.prev_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 测试版版本号：语义化自增（纯 x.y.z），取 beta 仓库已有 tag 的最大版号 +1。
      # 与用户手动构建的 -PversionNameOverride 对接（见 android-release.yml），
      # APK versionName 与本次发布的 release tag（beta-<x.y.z>）保持一致。
      # 自增 + 进位规则：y、z 只能一位（0-9），x 可多位；z+1，z>9 进位到 y，y>9 进位到 x
      # （例 1.0.9→1.1.0、1.9.9→2.0.0、9.9.9→10.0.0）。进位用 python3 计算，避免 bash 处理多位 x 出错。
      # 本步骤只读 tag、不发布，无副作用，故不挂 skip 守卫：即使本次最终早退，也不会真正消耗号
      # （版本号只在发布段的 gh release create 时才写入 beta 仓库）。
      - name: 计算版本号（读 beta tag 自增，纯 x.y.z）
        id: ver
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          TARGET_REPO: yhdmgf/aiverse-beta
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          # 拉全量 beta tag（releases 端点，分页兜底 per_page=100），过滤出纯数字格式 beta-x.y.z。
          # 现存旧 tag（如 beta-1.0.0-dev.0dd2936）不符合纯数字格式，会被正则过滤掉，不参与基线。
          TAGS_JSON="$(gh api "repos/$TARGET_REPO/tags?per_page=100" --paginate --jq '.[].name' 2>/dev/null || true)"
          BASE="$(printf '%s\n' "$TAGS_JSON" | grep -oE '^beta-[0-9]+\.[0-9]\.[0-9]$' | sed 's/^beta-//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)"
          if [ -z "$BASE" ]; then
            # 无有效基线（当前情况）：把旧 1.0.0-dev.x 视为已占用的 1.0.0，首个新格式为 1.0.1。
            BASE="1.0.0"
            echo "无有效基线 tag，锁定基线 $BASE（旧 1.0.0-dev.x 视为已占用），产出 1.0.1"
          else
            echo "最大基线 tag: $BASE"
          fi
          # 进位算法用 python3（runner 自带），避免 bash 处理多位 x 出错。
          VER="$(BASE="$BASE" python3 -c 'import os; x,y,z=(int(v) for v in os.environ["BASE"].split(".")); z+=1; (z,y)=(z,y) if z<10 else (0,y+1); (x,y)=(x,y) if y<10 else (x+1,0); print(f"{x}.{y}.{z}")')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=beta-$VER" >> "$GITHUB_OUTPUT"
          echo "本次测试版版本号: $VER（tag: beta-$VER，基线: $BASE）"

      # 早退检测：放在所有构建步骤之前，上次测试版构建的 commit 与本次 HEAD 相同则跳过 build/release
      # （不只跳过构建，连 JDK / 迁移对账 / 插件对账 / 还原签名 / 发布一并跳过），避免对同一提交重复跑。
      # 判定来源：分页拉全量 beta release，对每条 body 提取 commit 哈希建集合；
      # git rev-parse HEAD（全 40 位哈希）命中集合即 skip=true。发布段 body 写入的也是全 40 位哈希，
      # 保证判重不受截断影响（旧版 grep 出短哈希与全哈希长度不等，恒 false 导致早退从未生效）。
      - name: 早退检测（与上次构建同 commit 则跳过）
        id: earlycheck
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          TARGET_REPO: yhdmgf/aiverse-beta
        run: |
          set -e
          SHA=$(git rev-parse HEAD)
          # 分页拉全量 beta release body，提取每条的 commit 哈希建集合（哈希长度统一为全 40 位）。
          ALL_BODIES="$(gh api "repos/$TARGET_REPO/releases?per_page=100" --paginate --jq '.[].body' 2>/dev/null || true)"
          SEEN="$(printf '%s\n' "$ALL_BODIES" | grep -oE 'commit [0-9a-f]{40}' | awk '{print $2}' | sort -u)"
          # 供发布段复用作 git log 基线（取最新一条 release 的 commit；分页首条即最新）。
          PREV_SHA="$(printf '%s\n' "$ALL_BODIES" | grep -oE 'commit [0-9a-f]{40}' | head -n1 | awk '{print $2}' || true)"
          echo "full_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "prev_sha=${PREV_SHA}" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$SEEN" | grep -qx "$SHA"; then
            echo "上次构建 commit $SHA 与本次 HEAD 相同，跳过整个构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "需要构建（上次=${PREV_SHA:-无} 本次=$SHA）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.earlycheck.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 迁移对账
        if: steps.earlycheck.outputs.skip != 'true'
        run: python3 scripts/check_migrations.py

      # 插件 host 方法表对账：宿主 PluginRuntimeManager 的 host.* 分支与
      # plugins/sdk/types/host.d.ts 的 HostMethodMap 必须一一对应，改宿主忘改 SDK 会在这里被拦。
      - name: Check plugin host methods
        if: steps.earlycheck.outputs.skip != 'true'
        run: node scripts/check-host-methods.mjs

      # 插件页面桥对账：PluginWebBridge / PluginOverlayBridge 的 dispatch 分支与
      # assets/plugin-ui/aicode.js 的 call(...) 必须一一对应，否则运行期 METHOD_UNKNOWN。
      - name: Check plugin page bridge
        if: steps.earlycheck.outputs.skip != 'true'
        run: node scripts/check-page-bridge.mjs

      # 插件清单校验：用 plugins/schema/plugin.schema.json 校验仓库内所有 plugin.json，
      # 字段写错在 CI 就暴露，不用等装到设备上被 PluginManifestParser 拒绝。
      - name: Check plugin manifests
        if: steps.earlycheck.outputs.skip != 'true'
        run: node scripts/check-plugin-manifests.mjs

      # ── 阶段 2：构建。matrix 把三个 beta 包拆到三个 runner 同时并行。
      #    每个 matrix runner 是独立环境，prepare 还原的 jks 不会自动带过去，需各自从 Secrets 还原签名。
      #    任一失败 → needs 它的 release 阶段自动不跑，不会发布残缺产物。
      #    skip=true 时整段跳过（GitHub 把 skipped 依赖视为成功，release 的 needs 仍满足，
      #    故 release 也需同样判 skip != 'true' 才不会误发布）。
  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: universal   # 通用包：含 arm64 + x86_64 两套镜像，兼容所有设备，体积约为单架构两倍
            gradle_task: assembleUniversalBeta
          - name: armsolo     # arm64 真机
            gradle_task: assembleArmsoloBeta
          - name: x86solo     # x86_64 模拟器
            gradle_task: assembleX86soloBeta
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # matrix 各 runner 独立环境，需各自还原签名密钥（与 android-release.yml build job 一致，不入库）。
      # beta 继承 release 的签名配置，从仓库 Secrets 注入。
      - name: 还原 release 签名（从仓库 Secrets 注入）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KEYSTORE_B64" | base64 -d > app/AiVerse.jks
          printf 'storeFile=AiVerse.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties

      # 各自构建对应架构的 beta 包：版本号用 -PversionNameOverride 传 prepare 算出的 $VER（纯 x.y.z），
      # 与手动构建同一覆盖开关对接，使 APK 的 versionName 与本次发布的 release tag（beta-$VER）一致。
      - name: 构建 ${{ matrix.name }} beta（正式签名）
        run: >-
          ./gradlew :app:${{ matrix.gradle_task }}
          -PversionNameOverride=${{ needs.prepare.outputs.ver }}
          --stacktrace

      # 各自构建 + upload-artifact，发布阶段统一 download 汇总（artifact 名 apk-<arch>，供 release 用 pattern: apk-* 匹配）。
      - name: Upload ${{ matrix.name }} APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: app/build/outputs/apk/${{ matrix.name }}/beta/*.apk
          if-no-files-found: error
          retention-days: 7

      # beta/测试包同样是 R8 混淆产物，mapping 必须跟构建一起留存，否则线上崩溃无法还原。
      # mapping 随各自 APK 一起上传（artifact 名 mapping-<arch>），线上闪退时直接下载对应版本。
      - name: 上传 R8 mapping（retrace 用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ matrix.name }}
          path: |
            app/build/outputs/mapping/${{ matrix.name }}/beta/mapping.txt
            app/build/outputs/mapping/${{ matrix.name }}/beta/configuration.txt
            app/build/outputs/mapping/${{ matrix.name }}/beta/seeds.txt
            app/build/outputs/mapping/${{ matrix.name }}/beta/usage.txt
          if-no-files-found: warn
          retention-days: 90

  # ── 阶段 3：发布。needs: [prepare, build] 保证三个 APK 全部构建完成（且成功）才进入；
  #    download-artifact 汇总产物、拼 README、输出摘要、发布到测试版仓库 Releases。
  #    skip=true 时（build 被跳过）这里同样跳过，不会误发布。
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 三个 APK 全部下载到 apk/（pattern: apk-* + merge-multiple），集中重命名后一起发布。
      - name: 下载全部 APK 产物
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apk

      - name: 收集产物（重命名为发布文件名）
        run: |
          set -e
          mkdir -p dist
          cp apk/app-universal-beta.apk "dist/AiVerse-universal-beta.apk" || true
          cp apk/app-armsolo-beta.apk   "dist/AiVerse-arm64-beta.apk"    || true
          cp apk/app-x86solo-beta.apk   "dist/AiVerse-x86_64-beta.apk"   || true
          ls -la dist/
          test -n "$(ls dist/*.apk 2>/dev/null)"

      # 说明 txt：测试版声明 + 包含的三个 APK + 本次 commit + 构建时间 + 包名。
      - name: 生成 README.txt
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -e
          mkdir -p dist
          BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          cat > "dist/README.txt" <<EOF
          AiVerse 测试版（Beta）安装说明
          =================================

          【请先阅读】
          测试版不代表最终版本，仅供内部测试体验。
          请勿二次分发、转包、上传或分享给他人，禁止用于商业用途。
          测试包不参与应用内检查更新，不会触发覆盖正式版的升级提示。

          本次构建
          - commit：$SHA
          - 构建时间：$BUILD_TIME
          - 包名：com.aiverse.beta（可与正式版同机共存，互不覆盖）

          安装包选择
          本次提供三个 APK，请按设备类型选择安装：

          - AiVerse-universal-beta.apk
            通用版，包含 arm + x86 两套镜像，体积最大，任意设备可安装。
            不确定设备架构时，优先选择此版本。

          - AiVerse-arm64-beta.apk
            arm64 真机版，绝大多数真机选择此版本，体积最小。

          - AiVerse-x86_64-beta.apk
            x86_64 模拟器版，模拟器选择此版本。

          正式版下载
          https://aivapp.cn/download

          官方仓库
          https://github.com/yhdmgf/aiverse

          安装前请确认设备架构；如不确定，建议安装 universal 通用版。
          EOF
          # heredoc 正文必须与 run: | 块缩进一致（顶格会破坏 YAML），
          # 故写入后再剥掉行首 10 空格，让 txt 内容真正顶格。
          sed -i 's/^          //' "dist/README.txt"
          touch -d "1949-10-01 00:00:00" "dist/README.txt"

      - name: 输出构建信息到运行摘要
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          echo "## Nightly 构建（beta 测试包）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 构建: beta（正式签名 + R8，包名 com.aiverse.beta，与正式版独立共存）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 三架构: universal / arm64 / x86_64" >> "$GITHUB_STEP_SUMMARY"
          echo "- 测试包不参与检查更新（无应用内升级，避免导向正式包）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 下载: 下方三个 APK 资产（按设备类型选）+ README.txt" >> "$GITHUB_STEP_SUMMARY"

      # 三架构 APK 各自独立 + 测试版说明 txt，作为测试版仓库 Release 的资产。
      # VER/TAG/SHA/PREV_SHA 现从 needs.prepare.outputs.* 取（prepare 阶段已解析好），不再引用 steps.ver/steps.earlycheck。
      - name: 发布到测试版仓库 Releases
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          TARGET_REPO: yhdmgf/aiverse-beta
          VER: ${{ needs.prepare.outputs.ver }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.full_sha }}
          PREV_SHA: ${{ needs.prepare.outputs.prev_sha }}
        run: |
          set -e
          # commit 哈希用全 40 位写入 release body，与早退判重集合（同样提取 40 位）长度统一，
          # 不受短哈希截断影响（旧版写短哈希导致早退恒 false、同 commit 重跑撞 tag）。
          echo "本次发布版本: $VER（tag: $TAG）"

          # 幂等护栏（最后防线）：早退判重万一漏判（如 body 历史格式不规）时，
          # 若 tag 已存在则直接跳过，避免 gh release create 撞「same tag name already exists」报错。
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，跳过发布（幂等护栏）"
            exit 0
          fi

          # 自上个测试版以来的变更基线：复用 prepare 阶段早退检测已解析的 PREV_SHA（读最新 release body 里的 commit）。
          CHANGE_SUMMARY="无法确定上次构建基线"
          if [ -n "$PREV_SHA" ]; then
            # 需同时满足：对象存在 且 是 HEAD 祖先（防止上次从分叉分支构建，导致 PREV_SHA..HEAD 列表不准）
            if ! git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$PREV_SHA" HEAD 2>/dev/null; then
              echo "警告：上次测试版 commit $PREV_SHA 不在主仓库 HEAD 历史（不存在或非祖先），回退为最近提交"
              PREV_SHA=""
            fi
          fi
          if [ -n "$PREV_SHA" ]; then
            CHANGELOG=$(git log --oneline --no-decorate "${PREV_SHA}..HEAD")
            if [ -z "$(echo "$CHANGELOG" | tr -d '[:space:]')" ]; then
              CHANGE_SUMMARY="自上个测试版以来无新提交"
            else
              TOTAL=$(echo "$CHANGELOG" | wc -l | tr -d '[:space:]')
              CHANGE_SUMMARY="自上个测试版以来 ${TOTAL} 条提交"
            fi
          else
            CHANGE_SUMMARY="无法确定上次构建基线，列出最近 20 条提交"
          fi
          NOTES="$(
            printf '%s\n' "测试版构建（commit $SHA）。三架构 APK 见下方资产，按设备类型选择安装。测试版不代表最终版本，请勿二传。" "" "## 自上个测试版以来的变更"
            if [ -n "$PREV_SHA" ]; then
              if [ -z "$(echo "$CHANGELOG" | tr -d '[:space:]')" ]; then
                printf '%s\n' "无（自上次测试版后无新提交）"
              else
                # 按 Conventional Commits 类型粗分组（固定顺序），无法识别的归入「其它」
                for TYPE in feat fix refactor perf docs style test build ci chore; do
                  GROUP=$(printf '%s\n' "$CHANGELOG" | grep -E "^[0-9a-f]+ ${TYPE}(\\(|:)" || true)
                  if [ -n "$GROUP" ]; then
                    printf '%s\n' "### $TYPE"
                    printf '%s\n' "$GROUP" | sed -E "s/^[0-9a-f]+ ${TYPE}(\\([^)]*\\))?: /- /"
                    printf '%s\n' ""
                  fi
                done
                OTHER=$(printf '%s\n' "$CHANGELOG" | grep -vE "^[0-9a-f]+ (feat|fix|refactor|perf|docs|style|test|build|ci|chore)(\\(|:)" || true)
                if [ -n "$OTHER" ]; then
                  printf '%s\n' "### 其它"
                  printf '%s\n' "$OTHER" | sed -E "s/^[0-9a-f]+ //" | sed 's/^/- /'
                  printf '%s\n' ""
                fi
              fi
            else
              printf '%s\n' "无法确定上次构建基线，以下为最近提交：" ""
              git log --oneline --no-decorate -20
            fi
          )"
          echo "Release notes 已生成："
          printf '%s\n' "$NOTES"

          # 三个 APK 各自独立上传为 release 资产（文件名固定，不带版本号），附使用说明 txt
          gh release create "$TAG" \
            --repo "$TARGET_REPO" \
            --title "AiVerse 测试版 $VER" \
            --notes "$NOTES" \
            "dist/AiVerse-universal-beta.apk" \
            "dist/AiVerse-arm64-beta.apk" \
            "dist/AiVerse-x86_64-beta.apk" \
            "dist/README.txt"


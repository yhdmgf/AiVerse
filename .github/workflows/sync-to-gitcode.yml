name: Sync to GitCode

# 每 6 小时（北京时间 8:30 / 14:30 / 20:30 / 2:30）自动同步到 GitCode 镜像仓库
# 代码 + Tag + Release 公告 + APK 附件（幂等，已存在的跳过）
on:
  schedule:
    # 北京时间 6:30 / 12:30 / 18:30（= UTC 前一天22:30 / 当天4:30 / 10:30），与构建错开半小时
    - cron: '30 22 * * *'  # 北京 6:30
    - cron: '30 4 * * *'   # 北京 12:30
    - cron: '30 10 * * *'  # 北京 18:30
    - cron: '30 16 * * *'  # 北京 0:30
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查哈希并推送代码与 Tag
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          GITHUB_SHA=$(git rev-parse HEAD)
          echo "GitHub main HEAD: $GITHUB_SHA"

          # 用 Bearer header 认证（GitCode 标准方式）
          GITCODE_SHA=$(curl -sf --max-time 15 \
            -H "Authorization: Bearer ${GITCODE_TOKEN}" \
            "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/commits?sha=main&per_page=1" \
            | jq -r '.[0].sha // ""' 2>/dev/null || echo "")
          echo "GitCode main HEAD: ${GITCODE_SHA:-（空，首次推送）}"

          if [ -n "$GITCODE_SHA" ] && [ "$GITHUB_SHA" = "$GITCODE_SHA" ]; then
            echo "哈希相同（$GITHUB_SHA），跳过推送"
          else
            # oauth2 用户名是 GitCode 标准认证方式（令牌即密码）
            git remote add gitcode https://oauth2:${GITCODE_TOKEN}@gitcode.com/qldwi/aiverse.git
            git push gitcode main --force --tags 2>&1
            git remote remove gitcode
            echo "推送完成: $GITHUB_SHA → GitCode"
          fi

      - name: 同步 Release 公告与附件到 GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: yhdmgf/AiVerse
          GITCODE_OWNER: qldwi
          GITCODE_REPO: aiverse
        run: |
          python3 scripts/sync-gitcode-releases.py --all

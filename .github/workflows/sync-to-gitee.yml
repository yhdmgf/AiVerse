name: Sync to Gitee

# 每 6 小时自动同步到 Gitee 镜像仓库
# 代码 + Tag + Release 公告 + APK 附件（幂等，已存在的跳过）
on:
  schedule:
    # 北京时间 6:40 / 12:40 / 18:40 / 0:40（= UTC 前一天22:40 / 当天4:40 / 10:40 / 16:40），与 GitCode 同步错开 10 分钟
    - cron: '40 22 * * *'  # 北京 6:40
    - cron: '40 4 * * *'   # 北京 12:40
    - cron: '40 10 * * *'  # 北京 18:40
    - cron: '40 16 * * *'  # 北京 0:40
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查哈希并推送代码与 Tag
        env:
          GITEE_TOKEN: d8a5eb5fe4d532f4437d23d58a5774da
          GITEE_OWNER: aiverse-app
          GITEE_REPO: aiverse
          GITEE_USER: aiverse-app   # HTTPS 推送用户名 = Gitee 账号名（非 owner path）
        run: |
          GITHUB_SHA=$(git rev-parse HEAD)
          echo "GitHub main HEAD: $GITHUB_SHA"

          # 用 Bearer header 认证（Gitee 标准方式）
          GITEE_SHA=$(curl -sf --max-time 15 \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/commits?sha=main&per_page=1" \
            | jq -r '.[0].sha // ""' 2>/dev/null || echo "")
          echo "Gitee main HEAD: ${GITEE_SHA:-（空，首次推送）}"

          if [ -n "$GITEE_SHA" ] && [ "$GITHUB_SHA" = "$GITEE_SHA" ]; then
            echo "哈希相同（$GITHUB_SHA），跳过推送"
          else
            git remote add gitee https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git
            git push gitee main --force --tags 2>&1
            git remote remove gitee
            echo "推送完成: $GITHUB_SHA → Gitee"
          fi

      - name: 同步 Release 公告与附件到 Gitee
        env:
          GITEE_TOKEN: d8a5eb5fe4d532f4437d23d58a5774da
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: yhdmgf/AiVerse
          GITEE_OWNER: aiverse-app
          GITEE_REPO: aiverse
        run: |
          python3 scripts/sync-gitee-releases.py --all

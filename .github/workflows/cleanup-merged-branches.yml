name: 清理已关闭 PR 的分支

on:
  # PR 关闭后立即触发
  pull_request:
    types: [closed]
  # 每天中国时间早上 7:00 兜底（= UTC 23:00，处理 PR 关闭时未及时删的情况）
  schedule:
    - cron: '0 23 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  # 删除 PR 检查（pr-check.yml）的 workflow run 需要此权限；
  # GITHUB_TOKEN 仅能删 pull_request / push 事件的 run，正好覆盖要清的 pr-check 日志。
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 删除已关闭 PR 对应的分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          # 删除某个分支关联的全部 pr-check.yml 检查日志。
          # 只删 path == .github/workflows/pr-check.yml 的 run，不碰发版/同步/清理等其它 workflow；
          # cleanup 自身也不是 pr-check.yml，天然不会被误删。
          delete_pr_checks() {
            local branch="$1"
            local ids
            ids=$(gh api "/repos/$REPO/actions/runs?head_branch=$branch&per_page=100" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/pr-check.yml") | .id')
            if [ -z "$ids" ]; then
              echo "  无 pr-check 日志需清理: $branch"
              return
            fi
            for id in $ids; do
              gh api -X DELETE "/repos/$REPO/actions/runs/$id" >/dev/null 2>&1 \
                && echo "  已删除 pr-check 日志: run $id ($branch)" \
                || echo "  删除失败（可能已不存在或无权限）: run $id ($branch)"
            done
          }

          # ── PR 触发时：PR 已关闭（含合并）──
          if [ "${{ github.event_name }}" = "pull_request" ]; then

            # 1) 删除该 PR 产生的全部 pr-check.yml 检查日志（构建冒烟 + 单测 + 各项对账）
            echo "清理 PR 的 pr-check 检查日志（分支: $PR_HEAD）..."
            delete_pr_checks "$PR_HEAD"

            # 2) 删除该 PR 的源分支
            echo "删除源分支: $PR_HEAD"
            git push origin --delete "$PR_HEAD" 2>/dev/null \
              && echo "已删除: $PR_HEAD" \
              || echo "分支不存在或已删除: $PR_HEAD"
            exit 0
          fi

          # ── schedule / workflow_dispatch：定时兜底扫描 ──
          # 永久白名单：永不删除
          PERMANENT="main data"

          # 列出所有远程分支
          BRANCHES=$(git branch -r --format='%(refname:short)' \
            | grep '^origin/' | sed 's|^origin/||' | grep -v 'HEAD')

          for branch in $BRANCHES; do
            # 跳过永久白名单
            if echo "$PERMANENT" | grep -qw "$branch"; then
              echo "跳过（永久白名单）: $branch"
              continue
            fi

            # 通过 GitHub API 查询该分支是否有「已关闭」的 PR
            # 没有关联的已关闭 PR → 不删（手动创建的分支、仍在使用的分支全部保留）
            CLOSED_PR=$(gh pr list --state closed --head "$branch" \
              --json number --jq '.[0].number' 2>/dev/null)

            if [ -n "$CLOSED_PR" ] && [ "$CLOSED_PR" != "null" ]; then
              echo "处理（PR #$CLOSED_PR 已关闭）: $branch"
              # 先清该分支的 pr-check 检查日志，再删分支
              delete_pr_checks "$branch"
              git push origin --delete "$branch" 2>/dev/null \
                && echo "已删除: $branch" \
                || echo "删除失败（可能已不存在）: $branch"
            else
              echo "保留（无已关闭 PR）: $branch"
            fi
          done

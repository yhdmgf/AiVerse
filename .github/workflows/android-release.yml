name: Android Release

# 纯手动触发：推送 main 或 v* tag 都不会自动构建。
# 由用户手动输入版本号（第一框）+ 测试版 RC 数字（第二框，留空=正式版）触发构建。
#
# 多 job 结构，只在「构建」处并行化（三个 APK 三个 job 同时跑，省总时长）：
#   prepare —— 解析公告/版本号 + 还原签名 + 迁移对账（只跑一次），产出 version/prerelease 供下游复用
#   build   —— matrix 三个 APK（universal / armsolo / x86solo）并行构建，各自 upload-artifact
#   release —— needs: [prepare, build]，等三个产物全部就绪后 download-artifact 汇总、拼正文、发布
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0；构建时覆盖 App 内置版本号）'
        required: true
        default: '1.0.0'
        type: string
      rc:
        description: '测试版 RC 数字（留空=正式版；如 1 → 版本号-rc1）'
        required: false
        default: ''
        type: string
      notes:
        description: '更新公告（可留空。多行内容请写进 docs-site/release-notes/<版本号>.md；这里只适合一句话，换行用 \n 转义）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  # ── 阶段 1：准备。签名/公告/版本号/迁移对账只跑一次，结果通过 outputs 传给下游，
  #    避免 matrix 三个 runner 各自重复解析版本、重复做迁移对账。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.version.outputs.full }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 第一步就把「更新公告」输入解析成 MD 文档：输入框是单行的，多行内容填不进来，
      # 统一在这里转成文件，后续流程只按「文件是否有」来判断，逻辑单一。
      - name: 解析更新公告（输入 → MD 文档）
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          mkdir -p .release-notes
          INPUT_NOTES=".release-notes/from-input.md"
          rm -f "$INPUT_NOTES"
          if [ -n "$NOTES" ]; then
            printf '%b\n' "$NOTES" > "$INPUT_NOTES" || true
            echo "已把输入的更新公告写成 $INPUT_NOTES："
            cat "$INPUT_NOTES" || true
          else
            echo "未填写更新公告输入，跳过生成"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 还原 release 签名（从仓库 Secrets 注入，不写进代码/仓库）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KEYSTORE_B64" | base64 -d > app/AiVerse.jks
          printf 'storeFile=AiVerse.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties

      - name: 迁移对账
        run: python3 scripts/check_migrations.py

      - name: 解析版本号
        id: version
        run: |
          BASE="${{ github.event.inputs.version }}"
          RC="${{ github.event.inputs.rc }}"
          if [ -n "$RC" ]; then
            FULL="${BASE}-rc${RC}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            FULL="$BASE"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "构建版本: $FULL（预发布: ${RC:+是}${RC:-否}）"

      # 公告打包成 artifact，供发布阶段拼正文（签名密钥不跨 job 传，下游各自从 Secrets 还原）。
      - name: 上传公告 artifact（供发布阶段拼正文）
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-input
          path: .release-notes/from-input.md
          if-no-files-found: ignore
          retention-days: 1

  # ── 阶段 2：构建。matrix 把三个 APK 拆到三个 runner 同时并行。
  #    任一失败 → needs 它的 release 阶段自动不跑，不会发布残缺产物。
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: universal   # 通用包：含 arm64 + x86_64 两套镜像，兼容所有设备，体积约为单架构两倍
            gradle_task: assembleUniversalRelease
          - name: armsolo     # arm64 真机
            gradle_task: assembleArmsoloRelease
          - name: x86solo     # x86_64 模拟器
            gradle_task: assembleX86soloRelease
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # matrix 各 runner 独立环境，需各自还原签名密钥（与 prepare 一致，不入库）。
      - name: 还原 release 签名（从仓库 Secrets 注入）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KEYSTORE_B64" | base64 -d > app/AiVerse.jks
          printf 'storeFile=AiVerse.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties

      - name: 构建 ${{ matrix.name }} release（覆盖版本号 ${{ needs.prepare.outputs.full }}）
        run: >-
          ./gradlew :app:${{ matrix.gradle_task }}
          -PversionNameOverride=${{ needs.prepare.outputs.full }}
          --stacktrace

      # 各自构建 + upload-artifact，发布阶段统一 download 汇总。
      - name: Upload ${{ matrix.name }} outputs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: app/build/outputs/apk/${{ matrix.name }}/release/*.apk
          if-no-files-found: error
          retention-days: 7

      # 崩溃栈 retrace 需要「同一次构建」的 mapping.txt：release 包混淆后堆栈只有 a/b/c。
      # mapping 随各自 APK 一起上传，线上闪退时直接下载对应版本。
      - name: 上传 R8 mapping（retrace 用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ matrix.name }}
          path: |
            app/build/outputs/mapping/${{ matrix.name }}/release/mapping.txt
            app/build/outputs/mapping/${{ matrix.name }}/release/configuration.txt
            app/build/outputs/mapping/${{ matrix.name }}/release/seeds.txt
            app/build/outputs/mapping/${{ matrix.name }}/release/usage.txt
          if-no-files-found: warn
          retention-days: 180

  # ── 阶段 3：发布。needs: [prepare, build] 保证三个 APK 全部构建完成（且成功）才进入；
  #    download-artifact 汇总产物、拼正文、清理旧 Release、发布 GitHub Release。
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 三个 APK 全部下载到 apk/，集中重命名后一起发布。
      - name: 下载全部 APK 产物
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apk

      - name: 下载公告 artifact
        uses: actions/download-artifact@v4
        with:
          name: release-notes-input
          path: .release-notes
        continue-on-error: true

      - name: 收集产物（重命名为发布文件名）
        env:
          VER: ${{ needs.prepare.outputs.full }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 严格三包：任一缺失直接失败，不允许发出残缺版本
          cp apk/app-universal-release.apk "dist/AiVerse-universal-v${VER}.apk"
          cp apk/app-armsolo-release.apk   "dist/AiVerse-arm64-v${VER}.apk"
          cp apk/app-x86solo-release.apk   "dist/AiVerse-x86_64-v${VER}.apk"
          for f in "dist/AiVerse-universal-v${VER}.apk" "dist/AiVerse-arm64-v${VER}.apk" "dist/AiVerse-x86_64-v${VER}.apk"; do
            test -s "$f" || { echo "缺少产物: $f"; exit 1; }
          done
          ls -la dist/

      - name: 输出版本号到运行摘要（versionName + versionCode）
        env:
          FULL: ${{ needs.prepare.outputs.full }}
        run: |
          major=$(echo "$FULL" | cut -d. -f1)
          minor=$(echo "$FULL" | cut -d. -f2)
          patch=$(echo "$FULL" | cut -d. -f3)
          base=$((major*1000000 + minor*10000 + patch*100))
          rcnum=$(echo "$FULL" | sed -n 's/.*-rc\([0-9]*\)$/\1/p')
          if [ -n "$rcnum" ]; then
            rc=$((rcnum<49 ? rcnum : 49))
            VC=$((base+rc))
          elif echo "$FULL" | grep -qiE '[-.](dev|pre|beta|alpha|snapshot|dirty)'; then
            VC=$base
          else
            VC=$((base+50))
          fi
          {
            echo "## 构建版本号"
            echo ""
            echo "- versionName: $FULL"
            echo "- versionCode: $VC"
            echo ""
            echo "## APK 说明"
            echo ""
            echo "| 包名 | ABI | 适用设备 |"
            echo "|---|---|---|"
            echo "| AiVerse-arm64-v$FULL.apk | arm64-v8a | 新手机（推荐） |"
            echo "| AiVerse-x86_64-v$FULL.apk | x86_64 | 模拟器 / x86 设备 |"
            echo "| AiVerse-universal-v$FULL.apk | arm64-v8a + x86_64 | 通用包：同时含两套镜像，兼容所有设备，体积约为单架构包两倍 |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "versionName=$FULL versionCode=$VC"

      # 分发 API 入桶：必须在发布 Release 之前执行 —— 上传失败就不该对外发版。
      # 上传用带版本号的文件名（AiVerse-<abi>-v<ver>.apk），后端按文件名落到
      # 1.0/<ver>/ 目录，历史版本永不被覆盖（同名才覆盖）。
      - name: 上传三架构 APK 到分发 API（入桶 1.0/<ver>/）
        env:
          APK_UPLOAD_KEY: ${{ secrets.APK_UPLOAD_KEY }}
          FULL: ${{ needs.prepare.outputs.full }}
        run: |
          set -euo pipefail
          test -n "$APK_UPLOAD_KEY" || { echo "缺少 APK_UPLOAD_KEY secret"; exit 1; }

          UNIVERSAL="dist/AiVerse-universal-v${FULL}.apk"
          ARM64="dist/AiVerse-arm64-v${FULL}.apk"
          X86_64="dist/AiVerse-x86_64-v${FULL}.apk"
          for f in "$UNIVERSAL" "$ARM64" "$X86_64"; do
            test -s "$f" || { echo "缺少 APK: $f"; exit 1; }
          done

          # /apk/ 前缀被 CDN UrlAuth 规则拦截（会 401），上传入口固定走 /apkup/upload
          curl --fail-with-body --retry 5 --retry-delay 10 --retry-all-errors --max-time 3600 \
            -X POST "https://api.aivapp.cn/apkup/upload" \
            -H "X-Apk-Key: ${APK_UPLOAD_KEY}" \
            -F "files[]=@${UNIVERSAL};type=application/vnd.android.package-archive" \
            -F "files[]=@${ARM64};type=application/vnd.android.package-archive" \
            -F "files[]=@${X86_64};type=application/vnd.android.package-archive"

          echo "三架构 APK 已入桶（1.0/${FULL}/）：${FULL}" >> "$GITHUB_STEP_SUMMARY"

      - name: 清理旧 Release（避免重复累积）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ needs.prepare.outputs.full }}
        run: |
          TAG="v${FULL}"
          gh release delete "$TAG" --repo yhdmgf/AiVerse --yes --cleanup-tag || true

      # 正文拼装放在构建之后、发布之前：版本号此时已确定，按 docs-site/release-notes/<版本号>.md
      # 读取预写好的公告（Markdown），拼在 APK 说明后面。dispatch 输入框是单行的，
      # 所以多行公告走版本化文件，notes 输入只做一句话兜底。
      - name: 生成发布正文
        env:
          FULL: ${{ needs.prepare.outputs.full }}
        run: |
          mkdir -p dist
          # 顺序固定为：APK 说明标题 → 更新公告 → 包体表格。
          # 公告文件不存在 / 读不出来都只是"没有公告"，绝不能让发版失败。
          # 只做检测与读取：本次填了公告就用 prepare 阶段生成的 MD（显式输入优先），
          # 否则用按版本号预写的文件；都没有就跳过（不写占位文字，也不让发版失败）。
          NOTES_FILE="docs-site/release-notes/$FULL.md"
          INPUT_NOTES=".release-notes/from-input.md"
          {
            echo "## APK 说明"
            echo
            if [ -f "$INPUT_NOTES" ] && [ -r "$INPUT_NOTES" ]; then
              cat "$INPUT_NOTES" 2>/dev/null || true
            elif [ -f "$NOTES_FILE" ] && [ -r "$NOTES_FILE" ]; then
              cat "$NOTES_FILE" 2>/dev/null || true
            fi
            echo
            echo "| 包名 | ABI | 适用设备 |"
            echo "|---|---|---|"
            echo "| AiVerse-arm64-v$FULL.apk | arm64-v8a | 新手机（推荐） |"
            echo "| AiVerse-x86_64-v$FULL.apk | x86_64 | 模拟器 / x86 设备 |"
            echo "| AiVerse-universal-v$FULL.apk | arm64-v8a + x86_64 | 通用包：同时含两套镜像，兼容所有设备，体积约为单架构包两倍 |"
          } > dist/release-body.md
          echo "发布正文（前 12 行）："
          head -12 dist/release-body.md || true

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: dist/release-body.md
          # 正式版不使用 GitHub 自动生成的 "What's Changed"：
          # 那段是按 PR 作者归属拼出来的（PR 由贡献账号提就会署那个账号），
          # 正式版公告只用手写/文件里的正文。测试版（nightly-build.yml）保留自动列表。
          generate_release_notes: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          name: "v${{ needs.prepare.outputs.full }}"
          tag_name: "v${{ needs.prepare.outputs.full }}"
